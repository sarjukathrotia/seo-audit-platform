version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seo_audit_postgres
    environment:
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_password
      POSTGRES_DB: seo_audit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: seo_audit_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
